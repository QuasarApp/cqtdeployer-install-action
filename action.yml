name: 'Setup CQtDeployer'
description: 'Downloads, extracts, and installs CQtDeployer outside the workspace for Linux (x64/ARM), Windows (x64) and macOS (ARM64)'

inputs:
  latest:
    description: 'Download the latest stable release when "version" is not set. Set this to false only when you provide a specific "version".'
    default: 'true'
  version:
    description: 'Download a specific release tag instead of the latest release, e.g. "v1.6.2365". When set, it takes precedence over "latest".'
    default: ''

branding:
  icon: 'download'
  color: 'orange'

runs:
  using: "composite"
  steps:
    # Download and Extract CQtDeployer Linux x64
    - name: Download and Extract CQtDeployer Linux x64
      if: runner.os == 'Linux' && runner.arch == 'X64'
      uses: robinraju/release-downloader@v1
      with:
        repository: 'QuasarApp/CQtDeployer'
        latest: ${{ inputs.version == '' && inputs.latest != 'false' }}
        tag: ${{ inputs.version }}
        fileName: '*_Linux_x86_64.zip'
        extract: true
        out-file-path: ${{ runner.temp }}/cqt

    # Download and Extract CQtDeployer Linux ARM
    - name: Download and Extract CQtDeployer Linux ARM
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      uses: robinraju/release-downloader@v1
      with:
        repository: 'QuasarApp/CQtDeployer'
        latest: ${{ inputs.version == '' && inputs.latest != 'false' }}
        tag: ${{ inputs.version }}
        fileName: '*_Linux_ARM64.zip'
        extract: true
        out-file-path: ${{ runner.temp }}/cqt

    # Install CQtDeployer Linux
    - name: Install CQtDeployer Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Set execution permissions and add to PATH
        chmod +x "${{ runner.temp }}/cqt/CQtDeployer.sh"
        chmod +x "${{ runner.temp }}/cqt/bin/CQtDeployer"
        ln -sf "${{ runner.temp }}/cqt/CQtDeployer.sh" "${{ runner.temp }}/cqt/cqtdeployer"
        echo "${{ runner.temp }}/cqt" >> $GITHUB_PATH

    # Download and Extract CQtDeployer Windows
    - name: Download and Extract CQtDeployer Windows
      if: runner.os == 'Windows'
      uses: robinraju/release-downloader@v1
      with:
        repository: 'QuasarApp/CQtDeployer'
        latest: ${{ inputs.version == '' && inputs.latest != 'false' }}
        tag: ${{ inputs.version }}
        fileName: '*_Windows_AMD64.zip'
        extract: true
        out-file-path: ${{ runner.temp }}/cqt

    # Install CQtDeployer Windows
    - name: Install CQtDeployer Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Append CQtDeployer path to GITHUB_PATH using UTF-8 encoding
        $cqtPath = "${{ runner.temp }}/cqt"
        echo $cqtPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Download and Extract CQtDeployer macOS
    - name: Download and Extract CQtDeployer macOS
      if: runner.os == 'macOS'
      uses: robinraju/release-downloader@v1
      with:
        repository: 'QuasarApp/CQtDeployer'
        latest: ${{ inputs.version == '' && inputs.latest != 'false' }}
        tag: ${{ inputs.version }}
        fileName: '*_Darwin_arm64.zip'
        extract: true
        out-file-path: ${{ runner.temp }}/cqt

    # Install CQtDeployer macOS
    - name: Install CQtDeployer macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Configure rpath and sign the macOS binary
        pkg="${{ runner.temp }}/cqt/CQtDeployer"
        chmod +x "$pkg"
        chmod +x "${{ runner.temp }}/cqt/CQtDeployer.sh"
        install_name_tool -add_rpath @executable_path "$pkg"
        codesign --force --sign - "$pkg"
        echo "${{ runner.temp }}/cqt" >> "$GITHUB_PATH"
