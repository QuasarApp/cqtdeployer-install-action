name: 'Setup CQtDeployer'
description: 'Downloads, extracts, and installs CQtDeployer for Linux (x64/ARM), Windows (x64) and macOS (ARM64)'

inputs:
  latest:
    description: 'Download the latest stable release when "version" is not set. Set this to false only when you provide a specific "version".'
    default: 'true'
  version:
    description: 'Download a specific release tag instead of the latest release, e.g. "v1.6.2365". When set, it takes precedence over "latest".'
    default: ''

branding:
  icon: 'download'
  color: 'orange'

runs:
  using: "composite"
  steps:
    - name: Download and Extract CQtDeployer Linux x64
      if: runner.os == 'Linux' && runner.arch == 'X64'
      uses: robinraju/release-downloader@v1
      with:
        repository: 'QuasarApp/CQtDeployer'
        latest: ${{ inputs.version == '' && inputs.latest != 'false' }}
        tag: ${{ inputs.version }}
        fileName: '*_Linux_x86_64.zip'
        extract: true
        out-file-path: ${{ github.workspace }}/cqt

    - name: Download and Extract CQtDeployer Linux ARM
      # This step handles ARM64/aarch64 architecture runners
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      uses: robinraju/release-downloader@v1
      with:
        repository: 'QuasarApp/CQtDeployer'
        latest: ${{ inputs.version == '' && inputs.latest != 'false' }}
        tag: ${{ inputs.version }}
        fileName: '*_Linux_ARM64.zip'
        extract: true
        out-file-path: ${{ github.workspace }}/cqt

    - name: Install CQtDeployer Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        chmod +x "${{ github.workspace }}/cqt/CQtDeployer.sh"
        chmod +x "${{ github.workspace }}/cqt/bin/CQtDeployer"
        ln -s ${{ github.workspace }}/cqt/CQtDeployer.sh ${{ github.workspace }}/cqt/cqtdeployer
        echo "$GITHUB_WORKSPACE/cqt" >> $GITHUB_PATH

    - name: Download and Extract CQtDeployer Windows
      if: runner.os == 'Windows'
      uses: robinraju/release-downloader@v1
      with:
        repository: 'QuasarApp/CQtDeployer'
        latest: ${{ inputs.version == '' && inputs.latest != 'false' }}
        tag: ${{ inputs.version }}
        fileName: '*_Windows_AMD64.zip'
        extract: true
        out-file-path: ${{ github.workspace }}/cqt

    - name: Install CQtDeployer Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Safely append to GITHUB_PATH in Windows using UTF-8 encoding
        $cqtPath = "${{ github.workspace }}\cqt"
        echo $cqtPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Download and Extract CQtDeployer macOS
      # The macOS package is released as *_Darwin_arm64.zip (a flat archive
      # with the CQtDeployer executable, the CQtDeployer.sh launcher, the
      # dylibs and the QtCore.framework). The step follows the same rules as
      # the other platforms: an exact "version" is downloaded as is (it must
      # ship the Darwin zip asset), and without a "version" the latest
      # stable release is used. Until the first stable macOS release is
      # published the latest mode will fail with an error (issue #866 of
      # QuasarApp/CQtDeployer).
      if: runner.os == 'macOS'
      uses: robinraju/release-downloader@v1
      with:
        repository: 'QuasarApp/CQtDeployer'
        latest: ${{ inputs.version == '' && inputs.latest != 'false' }}
        tag: ${{ inputs.version }}
        fileName: '*_Darwin_arm64.zip'
        extract: true
        # The package is extracted into the "macos" directory because the
        # macOS runner filesystem is case-insensitive and a directory named
        # "CQtDeployer" cannot be created alongside the "cqtdeployer"
        # wrapper file in the cqt/ directory (issue #866 of
        # QuasarApp/CQtDeployer).
        out-file-path: ${{ github.workspace }}/cqt/macos

    - name: Install CQtDeployer macOS
      # The executable is linked against its dylibs and the QtCore
      # framework via @rpath without any LC_RPATH entries, so a small
      # "cqtdeployer" wrapper provides the DYLD search paths. The wrapper
      # is created next to (not inside) the package directory, because the
      # macOS runner filesystem is case-insensitive and a file named
      # "cqtdeployer" cannot be created alongside the "CQtDeployer"
      # executable (issue #866 of QuasarApp/CQtDeployer).
      if: runner.os == 'macOS'
      shell: bash
      run: |
        pkg_dir="${{ github.workspace }}/cqt/macos"
        chmod +x "${pkg_dir}/CQtDeployer"
        chmod +x "${pkg_dir}/CQtDeployer.sh"
        cat > "${{ github.workspace }}/cqt/cqtdeployer" << 'WRAPPER'
        #!/bin/sh
        BASE_DIR="$(cd "$(dirname "$0")/macos" && pwd)"
        export DYLD_LIBRARY_PATH="$BASE_DIR${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
        export DYLD_FRAMEWORK_PATH="$BASE_DIR${DYLD_FRAMEWORK_PATH:+:$DYLD_FRAMEWORK_PATH}"
        exec "$BASE_DIR/CQtDeployer" "$@"
        WRAPPER
        chmod +x "${{ github.workspace }}/cqt/cqtdeployer"
        echo "${{ github.workspace }}/cqt" >> "$GITHUB_PATH"